<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Torchie callout style sheet">
<rect width="100%" height="100%" fill="#0f172a"/>
<text x="600" y="44" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="26" font-weight="800" fill="#e5e7eb">Torchie Callout Style Sheet</text>
<text x="600" y="70" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" fill="#94a3b8">Upbeat, erratic, dryly cosmic robot helper. Helpful, never the source of truth.</text>
<rect x="80" y="130" width="470" height="160" rx="20" fill="#1f2937" stroke="#22c55e" stroke-width="3"/><rect x="104" y="168" width="92" height="72" rx="14" fill="#d1d5db" stroke="#22c55e" stroke-width="3"/><circle cx="132" cy="202" r="8" fill="#0f172a"/><circle cx="168" cy="202" r="8" fill="#0f172a"/><path d="M132,225 Q150,238 171,224" stroke="#0f172a" stroke-width="4" fill="none"/><line x1="150" y1="168" x2="150" y2="148" stroke="#22c55e" stroke-width="4"/><circle cx="150" cy="144" r="7" fill="#22c55e"/><text x="230" y="178" font-family="Inter,Segoe UI,Arial" font-size="22" font-weight="800" fill="#22c55e">Tip</text><text x="230" y="210" font-family="Inter,Segoe UI,Arial" font-size="16" fill="#e5e7eb">Try the boring fix first. The boring fix has</text><text x="230" y="234" font-family="Inter,Segoe UI,Arial" font-size="16" fill="#e5e7eb">a pension.</text><rect x="620" y="130" width="470" height="160" rx="20" fill="#1f2937" stroke="#eab308" stroke-width="3"/><rect x="644" y="168" width="92" height="72" rx="14" fill="#d1d5db" stroke="#eab308" stroke-width="3"/><circle cx="672" cy="202" r="8" fill="#0f172a"/><circle cx="708" cy="202" r="8" fill="#0f172a"/><path d="M672,225 Q690,238 711,224" stroke="#0f172a" stroke-width="4" fill="none"/><line x1="690" y1="168" x2="690" y2="148" stroke="#eab308" stroke-width="4"/><circle cx="690" cy="144" r="7" fill="#eab308"/><text x="770" y="178" font-family="Inter,Segoe UI,Arial" font-size="22" font-weight="800" fill="#eab308">Warning</text><text x="770" y="210" font-family="Inter,Segoe UI,Arial" font-size="16" fill="#e5e7eb">This setting can summon dependency goblins.</text><rect x="80" y="360" width="470" height="160" rx="20" fill="#1f2937" stroke="#ef4444" stroke-width="3"/><rect x="104" y="398" width="92" height="72" rx="14" fill="#d1d5db" stroke="#ef4444" stroke-width="3"/><circle cx="132" cy="432" r="8" fill="#0f172a"/><circle cx="168" cy="432" r="8" fill="#0f172a"/><path d="M132,455 Q150,468 171,454" stroke="#0f172a" stroke-width="4" fill="none"/><line x1="150" y1="398" x2="150" y2="378" stroke="#ef4444" stroke-width="4"/><circle cx="150" cy="374" r="7" fill="#ef4444"/><text x="230" y="408" font-family="Inter,Segoe UI,Arial" font-size="22" font-weight="800" fill="#ef4444">Crash / OOM</text><text x="230" y="440" font-family="Inter,Segoe UI,Arial" font-size="16" fill="#e5e7eb">Don’t panic. Check VRAM, logs, and what</text><text x="230" y="464" font-family="Inter,Segoe UI,Arial" font-size="16" fill="#e5e7eb">Torchie definitely did not touch.</text><rect x="620" y="360" width="470" height="160" rx="20" fill="#1f2937" stroke="#38bdf8" stroke-width="3"/><rect x="644" y="398" width="92" height="72" rx="14" fill="#d1d5db" stroke="#38bdf8" stroke-width="3"/><circle cx="672" cy="432" r="8" fill="#0f172a"/><circle cx="708" cy="432" r="8" fill="#0f172a"/><path d="M672,455 Q690,468 711,454" stroke="#0f172a" stroke-width="4" fill="none"/><line x1="690" y1="398" x2="690" y2="378" stroke="#38bdf8" stroke-width="4"/><circle cx="690" cy="374" r="7" fill="#38bdf8"/><text x="770" y="408" font-family="Inter,Segoe UI,Arial" font-size="22" font-weight="800" fill="#38bdf8">Source Check</text><text x="770" y="440" font-family="Inter,Segoe UI,Arial" font-size="16" fill="#e5e7eb">Cite the source. The void is persuasive but</text><text x="770" y="464" font-family="Inter,Segoe UI,Arial" font-size="16" fill="#e5e7eb">not peer reviewed.</text><text x="1180" y="700" text-anchor="end" font-family="Inter,Segoe UI,Arial" font-size="11" fill="#94a3b8">AIWF · Torchie visual guidance</text></svg>
