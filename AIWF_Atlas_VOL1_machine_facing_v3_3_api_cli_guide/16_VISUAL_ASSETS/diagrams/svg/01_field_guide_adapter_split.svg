<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Field Guide vs Knowledge Adapter">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <text x="600.0" y="38" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="24" font-weight="800" fill="#e5e7eb">Field Guide vs Knowledge Adapter</text>
  <text x="600.0" y="62" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" fill="#94a3b8">Human teaching layer stays readable; machine memory layer stays retrieval-ready.</text>
  <g filter="url(#shadow)">
<rect x="80" y="180" width="220" height="110" rx="14" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="190.0" y="208" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="700" fill="#e5e7eb">Field Guide</text>
<text x="190.0" y="232" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">Human learning, chapters,</text>
<text x="190.0" y="250" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">labs, examples</text>
<rect x="390" y="180" width="220" height="110" rx="14" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="500.0" y="208" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="700" fill="#e5e7eb">GitHub Repo</text>
<text x="500.0" y="232" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">Release wrapper, checksums,</text>
<text x="500.0" y="250" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">import notes</text>
<rect x="700" y="180" width="240" height="110" rx="14" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="820.0" y="208" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="700" fill="#e5e7eb">Knowledge Adapter</text>
<text x="820.0" y="232" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">Machine memory: lanes,</text>
<text x="820.0" y="250" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">cards, sources, policies</text>
<rect x="500" y="430" width="260" height="110" rx="14" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="630.0" y="458" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="700" fill="#e5e7eb">AI Assistant / RAG</text>
<text x="630.0" y="482" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">Retrieves, cites, routes,</text>
<text x="630.0" y="500" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">refuses junk when needed</text>
<line x1="300" y1="235.0" x2="390" y2="235.0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="345.0" y="227.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">companion</text>
<line x1="610" y1="235.0" x2="700" y2="235.0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="655.0" y="227.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">ships</text>
<line x1="940" y1="235.0" x2="500" y2="485.0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="720.0" y="352.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">loads into</text>
  </g>
  <text x="1182" y="702" text-anchor="end" font-family="Inter,Segoe UI,Arial" font-size="11" fill="#94a3b8">AI Without Fear Knowledge Adapter · visual aid</text>
</svg>
