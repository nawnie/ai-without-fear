<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="Synthetic Data Flywheel">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <text x="600.0" y="38" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="24" font-weight="800" fill="#e5e7eb">Synthetic Data Flywheel</text>
  <text x="600.0" y="62" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" fill="#94a3b8">Failure becomes targeted training material instead of a mysterious crater.</text>
  <g filter="url(#shadow)">
<rect x="80" y="170" width="190" height="90" rx="14" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="175.0" y="198" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="700" fill="#e5e7eb">Production Failure</text>
<text x="175.0" y="222" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">low confidence / bad answer</text>
<rect x="330" y="170" width="190" height="90" rx="14" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="425.0" y="198" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="700" fill="#e5e7eb">Failure Logs</text>
<text x="425.0" y="222" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">trace + context</text>
<rect x="580" y="170" width="190" height="90" rx="14" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="675.0" y="198" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="700" fill="#e5e7eb">Synthetic Generator</text>
<text x="675.0" y="222" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">target rare case</text>
<rect x="830" y="170" width="190" height="90" rx="14" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="925.0" y="198" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="700" fill="#e5e7eb">Curation Gates</text>
<text x="925.0" y="222" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">dedupe, judge, bias checks</text>
<rect x="580" y="420" width="190" height="90" rx="14" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="675.0" y="448" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="700" fill="#e5e7eb">Train / Tune / Evaluate</text>
<text x="675.0" y="472" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">compare lift</text>
<rect x="330" y="420" width="190" height="90" rx="14" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="425.0" y="448" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="700" fill="#e5e7eb">Deploy If Better</text>
<text x="425.0" y="472" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">version + monitor</text>
<line x1="270" y1="215.0" x2="330" y2="215.0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="520" y1="215.0" x2="580" y2="215.0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="770" y1="215.0" x2="830" y2="215.0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="1020" y1="215.0" x2="580" y2="465.0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="770" y1="465.0" x2="330" y2="465.0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="520" y1="465.0" x2="80" y2="215.0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="300.0" y="332.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">monitor</text>
  </g>
  <text x="1182" y="632" text-anchor="end" font-family="Inter,Segoe UI,Arial" font-size="11" fill="#94a3b8">AI Without Fear Knowledge Adapter · visual aid</text>
</svg>
