<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="lakeFS AI Data Versioning Loop">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <text x="600.0" y="38" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="24" font-weight="800" fill="#e5e7eb">lakeFS AI Data Versioning Loop</text>
  <text x="600.0" y="62" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" fill="#94a3b8">Data changes move like code: branch, validate, commit, merge, rollback if gremlins chew the wires.</text>
  <g filter="url(#shadow)">
<rect x="80" y="170" width="180" height="90" rx="14" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="170.0" y="198" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="700" fill="#e5e7eb">main branch</text>
<text x="170.0" y="222" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">production data</text>
<rect x="320" y="170" width="180" height="90" rx="14" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="410.0" y="198" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="700" fill="#e5e7eb">experiment branch</text>
<text x="410.0" y="222" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">zero-copy sandbox</text>
<rect x="560" y="170" width="180" height="90" rx="14" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="650.0" y="198" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="700" fill="#e5e7eb">ETL / Embeddings</text>
<text x="650.0" y="222" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">transform + generate</text>
<rect x="800" y="170" width="200" height="90" rx="14" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="900.0" y="198" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="700" fill="#e5e7eb">Quality Gates</text>
<text x="900.0" y="222" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">contracts + evals</text>
<rect x="320" y="400" width="180" height="90" rx="14" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="410.0" y="428" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="700" fill="#e5e7eb">Commit</text>
<text x="410.0" y="452" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">immutable snapshot</text>
<rect x="560" y="400" width="180" height="90" rx="14" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="650.0" y="428" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="700" fill="#e5e7eb">Merge</text>
<text x="650.0" y="452" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">promote if clean</text>
<rect x="800" y="400" width="200" height="90" rx="14" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="900.0" y="428" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="700" fill="#e5e7eb">Rollback</text>
<text x="900.0" y="452" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">restore known-good state</text>
<line x1="260" y1="215.0" x2="320" y2="215.0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="290.0" y="207.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">branch</text>
<line x1="500" y1="215.0" x2="560" y2="215.0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="530.0" y="207.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">run</text>
<line x1="740" y1="215.0" x2="800" y2="215.0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="770.0" y="207.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">check</text>
<line x1="1000" y1="215.0" x2="320" y2="445.0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="660.0" y="322.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">pass</text>
<line x1="500" y1="445.0" x2="560" y2="445.0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="530.0" y="437.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">promote</text>
<line x1="740" y1="445.0" x2="800" y2="445.0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="770.0" y="437.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">if bad</text>
<line x1="1000" y1="445.0" x2="80" y2="215.0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="540.0" y="322.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">recover</text>
  </g>
  <text x="1182" y="702" text-anchor="end" font-family="Inter,Segoe UI,Arial" font-size="11" fill="#94a3b8">AI Without Fear Knowledge Adapter · visual aid</text>
</svg>
