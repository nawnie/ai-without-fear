<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Source Verification Gate">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <text x="600.0" y="38" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="24" font-weight="800" fill="#e5e7eb">Source Verification Gate</text>
  <text x="600.0" y="62" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" fill="#94a3b8">Prevents unsupported claims from escaping the research hatch.</text>
  <g filter="url(#shadow)">
<rect x="70" y="180" width="180" height="90" rx="14" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="160.0" y="208" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="700" fill="#e5e7eb">Claim</text>
<text x="160.0" y="232" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">model, number, license, API,</text>
<text x="160.0" y="250" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">benchmark</text>
<rect x="310" y="180" width="190" height="90" rx="14" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="405.0" y="208" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="700" fill="#e5e7eb">Claim Type</text>
<text x="405.0" y="232" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">stable vs volatile</text>
<rect x="560" y="120" width="200" height="90" rx="14" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="660.0" y="148" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="700" fill="#e5e7eb">Primary / Official</text>
<text x="660.0" y="172" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">preferred source</text>
<rect x="560" y="260" width="200" height="90" rx="14" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="660.0" y="288" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="700" fill="#e5e7eb">Secondary Source</text>
<text x="660.0" y="312" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">allowed with label</text>
<rect x="820" y="180" width="220" height="90" rx="14" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="930.0" y="208" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="700" fill="#e5e7eb">Answer Gate</text>
<text x="930.0" y="232" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">verified / qualified / hold</text>
<rect x="470" y="470" width="240" height="90" rx="14" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="590.0" y="498" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="700" fill="#e5e7eb">Correction Queue</text>
<text x="590.0" y="522" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">when proof is missing</text>
<line x1="250" y1="225.0" x2="310" y2="225.0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="500" y1="225.0" x2="560" y2="165.0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="530.0" y="187.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">best</text>
<line x1="500" y1="225.0" x2="560" y2="305.0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="530.0" y="257.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">fallback</text>
<line x1="760" y1="165.0" x2="820" y2="225.0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="790.0" y="187.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">verified</text>
<line x1="760" y1="305.0" x2="820" y2="225.0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="790.0" y="257.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">qualified</text>
<line x1="1040" y1="225.0" x2="470" y2="515.0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="755.0" y="362.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">if weak</text>
  </g>
  <text x="1182" y="702" text-anchor="end" font-family="Inter,Segoe UI,Arial" font-size="11" fill="#94a3b8">AI Without Fear Knowledge Adapter · visual aid</text>
</svg>
