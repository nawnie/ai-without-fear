<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="ComfyUI Datatype Boundaries">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a"/>
  <text x="600.0" y="38" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="24" font-weight="800" fill="#e5e7eb">ComfyUI Datatype Boundaries</text>
  <text x="600.0" y="62" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" fill="#94a3b8">IMAGE, MASK, LATENT, CONDITIONING, and where conversions actually happen.</text>
  <g filter="url(#shadow)">
<rect x="60" y="120" width="190" height="90" rx="14" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="155.0" y="148" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="700" fill="#e5e7eb">IMAGE</text>
<text x="155.0" y="172" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">pixel tensor [B,H,W,C]</text>
<rect x="320" y="120" width="180" height="90" rx="14" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="410.0" y="148" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="700" fill="#e5e7eb">VAE Encode</text>
<text x="410.0" y="172" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">pixels → latent space</text>
<rect x="560" y="120" width="200" height="90" rx="14" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="660.0" y="148" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="700" fill="#e5e7eb">LATENT</text>
<text x="660.0" y="172" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">dict: samples [B,C,H,W]</text>
<rect x="820" y="120" width="200" height="90" rx="14" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="920.0" y="148" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="700" fill="#e5e7eb">KSampler</text>
<text x="920.0" y="172" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">latent denoising</text>
<rect x="60" y="330" width="190" height="90" rx="14" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="155.0" y="358" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="700" fill="#e5e7eb">MASK</text>
<text x="155.0" y="382" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">usually [B,H,W]</text>
<rect x="320" y="330" width="190" height="90" rx="14" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="415.0" y="358" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="700" fill="#e5e7eb">CONDITIONING</text>
<text x="415.0" y="382" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">text/control metadata</text>
<rect x="560" y="330" width="200" height="90" rx="14" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="660.0" y="358" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="700" fill="#e5e7eb">VAE Decode</text>
<text x="660.0" y="382" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">latent → pixels</text>
<rect x="820" y="330" width="200" height="90" rx="14" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
<text x="920.0" y="358" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="700" fill="#e5e7eb">IMAGE Output</text>
<text x="920.0" y="382" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">preview/save/postprocess</text>
<line x1="250" y1="165.0" x2="320" y2="165.0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="500" y1="165.0" x2="560" y2="165.0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="760" y1="165.0" x2="820" y2="165.0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="250" y1="375.0" x2="320" y2="375.0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="285.0" y="367.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#94a3b8">guides</text>
<line x1="1020" y1="165.0" x2="560" y2="375.0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="760" y1="375.0" x2="820" y2="375.0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  </g>
  <text x="1182" y="702" text-anchor="end" font-family="Inter,Segoe UI,Arial" font-size="11" fill="#94a3b8">AI Without Fear Knowledge Adapter · visual aid</text>
